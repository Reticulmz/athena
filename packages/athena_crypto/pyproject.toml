[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "athena-crypto"
requires-python = ">=3.14"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "athena_crypto"
python-source = "typings"
exclude = [
    "typings/athena_crypto/__pycache__/**",
    "typings/athena_crypto/*.pyc",
    "typings/athena_crypto/*.so",
    "typings/athena_crypto/*.pyd",
    "typings/athena_crypto/*.dylib",
]
