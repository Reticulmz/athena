[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-timeout",
    "ruff",
    "basedpyright",
    "import-linter",
    "gitlint-core",
    "pytest-fixture-classes>=1.0.4",
    "httpx2>=2.4.0",
    "interrogate==1.7.0",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = [
    "apps/athena_server",
    "packages/athena_crypto",
]

# --- Repository-wide Code Quality Policy ---

[tool.ruff]
target-version = "py314"
src = [
    "apps/athena_server/src",
    "apps/athena_server/tests",
    "packages/athena_crypto/typings",
    "packages/athena_crypto/scripts",
    "packages/athena_crypto/tests",
    "tools/monorepo_migration",
    "tools/gitlint",
]
line-length = 99

[tool.ruff.lint]
select = [
    "D",      # pydocstyle (Google convention, including D417)
    "F",      # pyflakes
    "E", "W", # pycodestyle
    "I",      # isort
    "N",      # pep8-naming
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "A",      # flake8-builtins
    "C4",     # flake8-comprehensions
    "DTZ",    # flake8-datetimez
    "T10",    # flake8-debugger
    "ISC",    # flake8-implicit-str-concat
    "PIE",    # flake8-pie
    "PT",     # flake8-pytest-style
    "RSE",    # flake8-raise
    "RET",    # flake8-return
    "SLF",    # flake8-self
    "SIM",    # flake8-simplify
    "TID",    # flake8-tidy-imports
    "TCH",    # flake8-type-checking
    "ARG",    # flake8-unused-arguments
    "PTH",    # flake8-use-pathlib
    "PL",     # pylint
    "TRY",    # tryceratops
    "FLY",    # flynt
    "PERF",   # perflint
    "RUF",    # ruff-specific
]
ignore = [
    "ISC001",   # conflicts with ruff formatter
    "TRY003",   # overly strict exception message rule
    "PLR0913",  # too many arguments (common in DI)
]

[tool.ruff.lint.per-file-ignores]
"apps/athena_server/tests/**/*.py" = ["PLR2004"]  # Magic numbers are common/expected in test assertions
"packages/athena_crypto/tests/**/*.py" = ["PLR2004"]  # Native compatibility tests assert protocol sizes and vectors
"tools/monorepo_migration/tests/**/*.py" = ["PLR2004"]  # Tooling test assertions use intentional literals
"tools/gitlint/tests/**/*.py" = ["PLR2004"]  # Gitlint rule tests assert stable rule identifiers and sets
"apps/athena_server/tests/unit/transports/bancho/test_di_registration.py" = ["PLC0415"]  # Requires local import to test laziness
"apps/athena_server/tests/integration/test_login_flow.py" = ["PLC0415"]
"apps/athena_server/tests/integration/test_polling_e2e.py" = ["PLC0415"]
"apps/athena_server/tests/integration/test_registration_flow.py" = ["PLC0415"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["osu_server", "athena_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.interrogate]
fail-under = 100
style = "sphinx"
ignore-init-method = false
ignore-init-module = false
ignore-magic = false
ignore-module = false
ignore-nested-functions = false
ignore-nested-classes = false
ignore-overloaded-functions = false
ignore-private = false
ignore-property-decorators = false
ignore-setters = false
ignore-semiprivate = false

[tool.basedpyright]
pythonVersion = "3.14"
pythonPlatform = "Linux"
typeCheckingMode = "all"
stubPath = "apps/athena_server/typings"
extraPaths = ["apps/athena_server/src", "apps/athena_server"]

[tool.pytest.ini_options]
testpaths = [
    "apps/athena_server/tests",
    "tools/monorepo_migration/tests",
    "tools/gitlint/tests",
]
markers = [
    "development_infrastructure: Nix toolchain上で明示実行するdevelopment infrastructure検証",
]
pythonpath = [".", "apps/athena_server"]
asyncio_mode = "auto"
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.athena.validation.package-tests."packages/athena_crypto/tests"]
verifier = "packages/athena_crypto/scripts/verify_artifact.py"
root-contract-test = "apps/athena_server/tests/unit/test_crypto_workspace_artifact.py"
