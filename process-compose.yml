version: "0.5"
# 依存processを逆順に停止し、ingress/worker/appをstate serviceより先に終了する.
ordered_shutdown: true

# ATHENA_WORKTREE_ROOT、ATHENA_STATE、PGDATA、PGHOST、PGPORTは
# side-effect-freeなNix development shellが現在worktree基準で提供する.

processes:
  postgres:
    command: |
      set -eu
      if [ ! -f "$PGDATA/PG_VERSION" ]; then
        echo "initializing postgres data directory..."
        initdb -D "$PGDATA" --no-locale --encoding=UTF8
        printf "listen_addresses = '127.0.0.1'\n" >> "$PGDATA/postgresql.conf"
        printf "unix_socket_directories = '%s'\n" "$PGDATA" >> "$PGDATA/postgresql.conf"
        printf "port = %s\n" "$PGPORT" >> "$PGDATA/postgresql.conf"
      fi
      if ! grep -Eq "^[[:space:]]*shared_preload_libraries[[:space:]]*=.*pg_search" "$PGDATA/postgresql.conf"; then
        printf "shared_preload_libraries = 'pg_search'\n" >> "$PGDATA/postgresql.conf"
      fi
      exec postgres -D "$PGDATA"
    readiness_probe:
      exec:
        command: pg_isready -h "$PGHOST" -p "$PGPORT" -d postgres
      initial_delay_seconds: 2
      period_seconds: 5
    shutdown:
      signal: 2
      timeout_seconds: 30

  postgres-init:
    command: |
      set -eu
      database_exists="$(
        psql \
          --host "$PGHOST" \
          --port "$PGPORT" \
          --dbname postgres \
          --tuples-only \
          --no-align \
          --command "SELECT 1 FROM pg_database WHERE datname = 'athena'"
      )"
      if [ "$database_exists" = "1" ]; then
        exit 0
      fi
      exec createdb --host "$PGHOST" --port "$PGPORT" athena
    depends_on:
      postgres:
        condition: process_healthy
    availability:
      restart: "no"

  postgres-migrate:
    command: exec uv run --directory apps/athena_server alembic upgrade head
    depends_on:
      postgres:
        condition: process_healthy
      postgres-init:
        condition: process_completed_successfully
    availability:
      restart: "no"

  valkey:
    command: |
      valkey_port="${VALKEY_PORT:-6379}"
      exec valkey-server \
        --port "$valkey_port" \
        --dir "$ATHENA_WORKTREE_ROOT/.state/valkey" \
        --daemonize no
    readiness_probe:
      exec:
        command: valkey-cli -p "${VALKEY_PORT:-6379}" ping
      initial_delay_seconds: 1
      period_seconds: 5
    shutdown:
      signal: 15
      timeout_seconds: 10

  app:
    command: exec uv run --directory apps/athena_server python -m osu_server
    depends_on:
      postgres:
        condition: process_healthy
      postgres-init:
        condition: process_completed_successfully
      postgres-migrate:
        condition: process_completed_successfully
      valkey:
        condition: process_healthy
    readiness_probe:
      exec:
        command: >-
          python -c 'import sys; from urllib.request import urlopen;
          response = urlopen(sys.argv[1], timeout=2); response.close()'
          "http://127.0.0.1:${SERVER_PORT:-8000}/health"
      # Development StatReloadの初回起動をprobe failureとして扱わないgrace period.
      initial_delay_seconds: 15
      period_seconds: 2
    shutdown:
      signal: 15
      timeout_seconds: 30

  worker:
    # uv wrapperを置き換え、Taskiqが停止signalを直接受け取る.
    command: exec uv run --directory apps/athena_server taskiq worker osu_server.worker:broker
    depends_on:
      postgres:
        condition: process_healthy
      postgres-init:
        condition: process_completed_successfully
      postgres-migrate:
        condition: process_completed_successfully
      valkey:
        condition: process_healthy
    shutdown:
      signal: 15
      timeout_seconds: 30

  nginx:
    command: >-
      exec nginx
      -p "$ATHENA_WORKTREE_ROOT/"
      -e "$ATHENA_WORKTREE_ROOT/.state/nginx/error.log"
      -c "$ATHENA_WORKTREE_ROOT/.state/nginx/nginx.conf"
      -g "daemon off;"
    shutdown:
      signal: 3
      timeout_seconds: 5

  cloudflared:
    command: |
      set -eu
      tunnel_id="$(
        python "$ATHENA_WORKTREE_ROOT/infra/development/validate_state.py" \
          tunnel-id \
          "$ATHENA_WORKTREE_ROOT"
      )"
      exec cloudflared tunnel \
        --origincert "$ATHENA_WORKTREE_ROOT/.state/cloudflared/login-home/.cloudflared/cert.pem" \
        --config "$ATHENA_WORKTREE_ROOT/.state/cloudflared/config.yml" \
        --no-autoupdate \
        run \
        --credentials-file "$ATHENA_WORKTREE_ROOT/.state/cloudflared/credentials.json" \
        "$tunnel_id"
    shutdown:
      signal: 15
      timeout_seconds: 35
