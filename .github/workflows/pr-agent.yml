name: PR Agent

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, ready_for_review, synchronize]
  issue_comment:
    types: [created, edited]

jobs:
  pr-agent:
    if: >-
      ${{
        github.event.sender.type != 'Bot' &&
        (
          github.event_name == 'pull_request' ||
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request != null &&
            (
              startsWith(github.event.comment.body, '/review') ||
              startsWith(github.event.comment.body, '/describe') ||
              startsWith(github.event.comment.body, '/improve') ||
              startsWith(github.event.comment.body, '/ask') ||
              startsWith(github.event.comment.body, '/update_changelog') ||
              startsWith(github.event.comment.body, '/config') ||
              startsWith(github.event.comment.body, '/help')
            )
          )
        )
      }}
    name: Review PR
    runs-on: ubuntu-latest
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.run_id }}
      cancel-in-progress: true
    permissions:
      contents: read
      issues: write
      pull-requests: write
    env:
      PR_AGENT_OPENAI_API_BASE: ${{ secrets.PR_AGENT_OPENAI_API_BASE || vars.PR_AGENT_OPENAI_API_BASE }}
      PR_AGENT_OPENAI_KEY: ${{ secrets.PR_AGENT_OPENAI_KEY }}

    steps:
      - name: Skip when PR-Agent credentials are not configured
        if: ${{ env.PR_AGENT_OPENAI_KEY == '' || env.PR_AGENT_OPENAI_API_BASE == '' }}
        run: echo "PR-Agent skipped because PR_AGENT_OPENAI_KEY or PR_AGENT_OPENAI_API_BASE is not configured."

      - name: Check issue commenter permission
        id: commenter-permission
        if: ${{ github.event_name == 'issue_comment' }}
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENTER: ${{ github.event.comment.user.login }}
          REPOSITORY: ${{ github.repository }}
        run: |
          permission="$(
            gh api "repos/${REPOSITORY}/collaborators/${COMMENTER}/permission" \
              --jq '.permission' 2>/dev/null || echo none
          )"

          case "$permission" in
            admin|write)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Run PR Agent
        if: >-
          ${{
            env.PR_AGENT_OPENAI_KEY != '' &&
            env.PR_AGENT_OPENAI_API_BASE != '' &&
            (
              github.event_name == 'pull_request' ||
              steps.commenter-permission.outputs.authorized == 'true'
            )
          }}
        uses: docker://pragent/pr-agent@sha256:b81235c3bddc551939a1feca8926f4b6e8abcec2ae5bf4620424f8f56dd9cb93
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI_KEY: ${{ env.PR_AGENT_OPENAI_KEY }}
          OPENAI__KEY: ${{ env.PR_AGENT_OPENAI_KEY }}
          OPENAI__API_BASE: ${{ env.PR_AGENT_OPENAI_API_BASE }}
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "true"
          github_action_config.auto_improve: "false"
          github_action_config.pr_actions: '["opened", "reopened", "ready_for_review", "synchronize"]'
